name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Moindre privilège : le token GitHub ne peut que lire le dépôt
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA : un tag peut être déplacé par un attaquant
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q app.py

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests (pytest + couverture)
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit pip-audit
      - name: SAST (Bandit)
        run: bandit -r . -x ./test_app.py
      - name: SCA (pip-audit)
        run: pip-audit -r requirements.txt
      # Bloquant : le job échoue sur une vulnérabilité HIGH/CRITICAL corrigeable ou un secret
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  deploy:
    needs: [test, scan]
    # Uniquement sur main, jamais depuis une pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Simulated Deploy (staging)
        run: echo "✅ Déploiement simulé en staging (commit ${{ github.sha }})"
